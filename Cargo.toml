[package]
name = "bro"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bro"
path = "src/main.rs"

[dependencies]
clap       = { version = "=4.4.18", features = ["derive"] }
tokio      = { version = "=1.35.1", features = ["full"] }
serde      = { version = "1",       features = ["derive"] }
serde_json = "1"
anyhow     = "1"
dotenv     = "0.15"
colored    = "=2.0.4"
chrono     = "=0.4.31"
dirs       = "=4.0.0"
toml       = "=0.5.11"
reqwest = { version = "0.11.27", features = ["json"] }